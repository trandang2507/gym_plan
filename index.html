<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="description" content="Plan tập tăng cơ 4 buổi/tuần (Upper/Lower) với streak tracking, rest timer và hướng dẫn chi tiết">
<title>GymTrack — Push · Pull · Legs · Ngực/Lưng · Vai/Tay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════ DESIGN TOKENS ═══════════════ */
:root {
  --bg: #0d1117; --bg2: #161b22; --surface: #1c2128; --surface2: #21262d;
  --glass: rgba(255,255,255,.04); --glass2: rgba(255,255,255,.07);
  --ink: #e6edf3; --ink2: #c9d1d9; --muted: #7d8590; --faint: #484f58;
  --border: rgba(255,255,255,.08); --border2: rgba(255,255,255,.12);
  --accent: #ff6b6b; --accent-glow: rgba(255,107,107,.15);
  --green: #3fb950; --yellow: #d29922; --blue: #58a6ff; --purple: #bc8cff;
  --radius: 16px; --radius-sm: 10px; --radius-xs: 6px;
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ease: cubic-bezier(.4,0,.2,1);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* ═══════════════ RESET ═══════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; scroll-padding-top: var(--safe-top); }
body { font-family: var(--font); font-size: 15px; line-height: 1.55; color: var(--ink); background: var(--bg);
  min-height: 100dvh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
img { max-width: 100%; }

/* ═══════════════ SCROLLBAR ═══════════════ */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 3px; }

/* ═══════════════ LAYOUT ═══════════════ */
.app { max-width: 520px; margin: 0 auto; padding: 0 16px; padding-top: calc(var(--safe-top) + 12px);
  padding-bottom: calc(var(--safe-bottom) + 80px); min-height: 100dvh; }

/* ═══════════════ HEADER ═══════════════ */
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), #ff8e53);
  display: grid; place-items: center; font-size: 18px; }
.logo h1 { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
.logo h1 span { background: linear-gradient(135deg, var(--accent), #ff8e53); -webkit-background-clip: text;
  -webkit-text-fill-color: transparent; background-clip: text; }
.header-actions { display: flex; gap: 6px; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; background: var(--glass); border: 1px solid var(--border);
  display: grid; place-items: center; transition: all .2s var(--ease); }
.icon-btn:hover { background: var(--glass2); border-color: var(--border2); }
.icon-btn svg { width: 18px; height: 18px; color: var(--muted); }

/* ═══════════════ STATS BAR ═══════════════ */
.stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
.stat-card { background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 14px; text-align: center; position: relative; overflow: hidden; transition: all .3s var(--ease); }
.stat-card::before { content: ''; position: absolute; inset: 0; background: var(--stat-glow, transparent); opacity: .08; }
.stat-card:hover { border-color: var(--border2); transform: translateY(-1px); }
.stat-icon { font-size: 20px; margin-bottom: 4px; }
.stat-value { font-size: 28px; font-weight: 800; line-height: 1.1; letter-spacing: -.02em; }
.stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; margin-top: 2px; }

/* ═══════════════ WEEK NAV ═══════════════ */
.week-nav { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 20px; }
.day-btn { display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 10px 4px 8px; border-radius: var(--radius-sm); border: 1.5px solid var(--border);
  background: var(--glass); transition: all .25s var(--ease); position: relative; }
.day-btn .day-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--day-color, var(--faint));
  transition: all .25s var(--ease); }
.day-btn .day-name { font-size: 13px; font-weight: 700; letter-spacing: -.01em; }
.day-btn .day-label { font-size: 10px; color: var(--muted); font-weight: 500; line-height: 1; }
.day-btn.active { border-color: var(--day-color); background: var(--day-glow);
  box-shadow: 0 0 20px var(--day-glow), inset 0 1px 0 rgba(255,255,255,.06); }
.day-btn.active .day-dot { width: 10px; height: 10px; box-shadow: 0 0 8px var(--day-color); }
.day-btn.rest-btn { opacity: .45; cursor: default; }
.day-btn.rest-btn .day-dot { background: transparent; border: 2px dashed var(--faint); width: 10px; height: 10px; }
.day-btn:not(.rest-btn):hover { border-color: var(--day-color); }
.day-btn .check-mark { position: absolute; top: 3px; right: 3px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--green); display: grid; place-items: center; font-size: 7px; color: #fff; }

/* ═══════════════ DAY HEADER ═══════════════ */
.day-header { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
.day-header .color-bar { width: 5px; height: 44px; border-radius: 3px; background: var(--accent); flex-shrink: 0; }
.day-header h2 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.day-header .day-sub { font-size: 13px; color: var(--muted); font-weight: 500; }
.day-progress { font-size: 13px; color: var(--muted); margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
.progress-bar { flex: 1; height: 4px; background: var(--glass2); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s var(--ease); }

/* ═══════════════ EXERCISE LIST ═══════════════ */
.ex-list { display: grid; gap: 8px; margin-bottom: 16px; }
.ex-item { display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 12px;
  padding: 14px 16px; background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius-sm);
  transition: all .25s var(--ease); cursor: pointer; width: 100%; text-align: left; }
.ex-item:hover { background: var(--glass2); border-color: var(--border2); transform: translateX(3px); }
.ex-item.done { border-color: rgba(63,185,80,.3); background: rgba(63,185,80,.05); }
.ex-num { font-size: 22px; font-weight: 800; color: var(--accent); opacity: .6; line-height: 1; }
.ex-item.done .ex-num { color: var(--green); opacity: .4; }
.ex-name { font-size: 15px; font-weight: 600; line-height: 1.25; }
.ex-muscle { font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 1px; }
.ex-right { text-align: right; }
.ex-sets { font-size: 14px; font-weight: 700; white-space: nowrap; }
.ex-status { font-size: 11px; color: var(--muted); margin-top: 1px; }
.ex-item.done .ex-status { color: var(--green); font-weight: 600; }

/* Recovery items */
.recovery-item { padding: 16px; background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; }
.recovery-item h3 { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
.recovery-item p { font-size: 13px; color: var(--muted); }

.cal-day.rest:not(.checked) { opacity: .4; }
/* ═══════════════ NOTE ═══════════════ */
.note { padding: 14px 16px; background: rgba(210,153,34,.06); border: 1px solid rgba(210,153,34,.15);
  border-radius: var(--radius-sm); font-size: 13px; color: var(--ink2); margin-top: 4px; line-height: 1.5; }
.note strong { color: var(--yellow); }

/* ═══════════════ CHECK-IN BUTTON ═══════════════ */
.checkin-wrap { position: fixed; bottom: calc(var(--safe-bottom) + 62px); left: 0; right: 0; padding: 12px 16px 10px;
  background: linear-gradient(to top, var(--bg) 60%, transparent); z-index: 50; display: flex; justify-content: center; }
.checkin-btn { max-width: 520px; width: 100%; padding: 14px 24px; border-radius: 14px;
  background: linear-gradient(135deg, var(--accent), #ff8e53); color: #fff; font-weight: 700; font-size: 16px;
  letter-spacing: -.01em; display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 4px 24px rgba(255,107,107,.3); transition: all .3s var(--ease); }
.checkin-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 32px rgba(255,107,107,.4); }
.checkin-btn:active { transform: translateY(0); }
.checkin-btn.checked { background: linear-gradient(135deg, var(--green), #2ea043); box-shadow: 0 4px 24px rgba(63,185,80,.3); }
.checkin-btn.checked:hover { box-shadow: 0 6px 32px rgba(63,185,80,.4); }

/* ═══════════════ EXERCISE PAGE ═══════════════ */
.page-view { animation: slideIn .3s var(--ease); }
@keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
@keyframes slideOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(-30px); } }

.back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px 8px 10px;
  border-radius: 999px; background: var(--glass); border: 1px solid var(--border); font-size: 13px; font-weight: 600;
  color: var(--muted); transition: all .2s var(--ease); margin-bottom: 4px; }
.back-btn:hover { background: var(--glass2); color: var(--ink); }
.back-btn svg { width: 16px; height: 16px; }
.ex-pos { font-size: 13px; color: var(--muted); margin-left: 10px; }

.page-title { font-size: 28px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; margin: 14px 0 4px; }
.page-meta { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.chip { padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
  border: 1px solid var(--accent); color: var(--accent); background: var(--accent-glow); }

/* Set tracker card */
.tracker-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 24px 20px; margin-bottom: 14px; text-align: center; }
.set-display { font-size: 64px; font-weight: 900; line-height: 1; letter-spacing: -.04em; margin-bottom: 2px; }
.set-display small { font-size: 28px; color: var(--muted); font-weight: 700; }
.set-label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; margin-bottom: 16px; }
.dots { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.dot { width: 36px; height: 36px; border-radius: 50%; border: 2.5px solid var(--faint);
  display: grid; place-items: center; font-size: 15px; font-weight: 700; color: var(--faint);
  transition: all .3s var(--ease); }
.dot.on { border-color: var(--accent); background: var(--accent); color: #fff;
  box-shadow: 0 0 12px var(--accent-glow); animation: dotPop .35s var(--ease); }
@keyframes dotPop { 0% { transform: scale(.7); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }

.main-btn { width: 100%; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: 700;
  letter-spacing: -.01em; transition: all .2s var(--ease);
  background: linear-gradient(135deg, var(--accent), #ff8e53); color: #fff;
  box-shadow: 0 4px 20px var(--accent-glow); }
.main-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 28px var(--accent-glow); }
.main-btn:active { transform: translateY(0); }
.main-btn:disabled { opacity: .4; cursor: default; transform: none; box-shadow: none; }

.btn-row { display: flex; gap: 8px; margin-top: 10px; }
.ghost-btn { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--glass);
  font-size: 13px; font-weight: 600; color: var(--muted); transition: all .2s var(--ease); }
.ghost-btn:hover { background: var(--glass2); color: var(--ink); }
.ghost-btn:disabled { opacity: .35; cursor: default; }

/* Finish state */
.finish-card { border: 2px solid var(--green); background: rgba(63,185,80,.06); border-radius: var(--radius);
  padding: 24px; text-align: center; margin-bottom: 14px; }
.finish-card .finish-icon { font-size: 48px; margin-bottom: 8px; }
.finish-card h3 { font-size: 22px; font-weight: 800; color: var(--green); margin-bottom: 4px; }
.finish-card p { font-size: 13px; color: var(--muted); margin-bottom: 14px; }

/* Weight log */
.weight-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px; margin-bottom: 14px; }
.weight-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.weight-row { display: flex; align-items: center; gap: 10px; }
.weight-input { flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--bg); font-size: 16px; font-weight: 600; text-align: center; color: var(--ink); }
.weight-input::placeholder { color: var(--faint); }
.weight-unit { font-size: 14px; font-weight: 600; color: var(--muted); }
.weight-prev { font-size: 12px; color: var(--muted); margin-top: 6px; }
.weight-prev .up { color: var(--green); }
.weight-prev .down { color: var(--accent); }

/* Rest timer */
.timer-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; margin-bottom: 14px; text-align: center; overflow: hidden; position: relative; }
.timer-card.active { border-color: var(--accent); }
.timer-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
.timer-presets { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
.timer-preset { padding: 6px 16px; border-radius: 999px; border: 1px solid var(--border); font-size: 13px;
  font-weight: 600; transition: all .2s var(--ease); }
.timer-preset.active { border-color: var(--accent); background: var(--accent-glow); color: var(--accent); }
.timer-preset:hover { border-color: var(--accent); }
.timer-display { font-size: 56px; font-weight: 900; letter-spacing: -.03em; line-height: 1; margin-bottom: 8px;
  font-variant-numeric: tabular-nums; }
.timer-display.running { color: var(--accent); }
.timer-display.done { color: var(--green); animation: pulse 1s var(--ease) infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
.timer-bar { height: 4px; background: var(--glass2); border-radius: 2px; overflow: hidden; margin-bottom: 14px; }
.timer-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .1s linear; }
.timer-actions { display: flex; gap: 8px; justify-content: center; }
.timer-btn { padding: 8px 20px; border-radius: 10px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--border); transition: all .2s var(--ease); }
.timer-btn.start { background: linear-gradient(135deg, var(--accent), #ff8e53); color: #fff; border: none; }
.timer-btn:hover { transform: translateY(-1px); }

/* Info cards */
.info-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px; margin-bottom: 14px; }
.info-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.steps-list { list-style: none; counter-reset: step; }
.steps-list li { counter-increment: step; margin-bottom: 10px; padding-left: 32px; position: relative;
  font-size: 14px; color: var(--ink2); line-height: 1.5; }
.steps-list li::before { content: counter(step); position: absolute; left: 0; top: 1px;
  width: 22px; height: 22px; border-radius: 50%; background: var(--accent-glow); color: var(--accent);
  font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.tips-list { list-style: none; }
.tips-list li { margin-bottom: 8px; padding: 10px 14px; border-left: 3px solid var(--accent);
  background: var(--accent-glow); border-radius: 0 var(--radius-xs) var(--radius-xs) 0;
  font-size: 13px; color: var(--ink2); }

/* Video */
.video-wrap { margin-bottom: 14px; }
.player { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden;
  background: #000; border: 1px solid var(--border); }
.player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video-link { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px;
  border-radius: 12px; background: linear-gradient(135deg, var(--accent), #ff8e53); color: #fff;
  font-weight: 600; font-size: 14px; transition: all .2s var(--ease); }
.video-link:hover { transform: translateY(-1px); color: #fff; }
.video-link svg { width: 18px; height: 18px; }
.video-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
.video-hint a { color: var(--muted); text-decoration: underline; }

/* Nav buttons */
.nav-btns { display: flex; gap: 8px; margin-top: 6px; }
.nav-btn { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--glass);
  font-weight: 600; font-size: 14px; transition: all .2s var(--ease); }
.nav-btn:hover:not(:disabled) { background: var(--glass2); border-color: var(--border2); }
.nav-btn:disabled { opacity: .35; cursor: default; }

/* ═══════════════ STATS VIEW ═══════════════ */
.stats-title { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 20px; }
.streak-hero { text-align: center; padding: 32px 20px; background: linear-gradient(135deg, rgba(255,107,107,.08), rgba(255,142,83,.05));
  border: 1px solid rgba(255,107,107,.15); border-radius: var(--radius); margin-bottom: 16px; position: relative; overflow: hidden; }
.streak-hero::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
  background: radial-gradient(circle at 50% 50%, rgba(255,107,107,.06) 0%, transparent 50%);
  animation: glow 6s ease infinite; }
@keyframes glow { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
.streak-fire { font-size: 52px; margin-bottom: 6px; position: relative; }
.streak-number { font-size: 64px; font-weight: 900; line-height: 1; letter-spacing: -.04em; position: relative; }
.streak-text { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em;
  font-weight: 600; position: relative; margin-top: 4px; }
.streak-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.streak-stat { padding: 16px; background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius-sm);
  text-align: center; }
.streak-stat .val { font-size: 28px; font-weight: 800; line-height: 1.1; }
.streak-stat .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; margin-top: 2px; }

/* Calendar heatmap */
.calendar-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px; margin-bottom: 16px; }
.calendar-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-nav span { font-size: 14px; font-weight: 600; }
.cal-nav button { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px; font-weight: 600; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-header { font-size: 10px; color: var(--faint); text-align: center; font-weight: 600; padding: 4px 0; }
.cal-day { aspect-ratio: 1; border-radius: var(--radius-xs); display: grid; place-items: center;
  font-size: 12px; font-weight: 500; color: var(--muted); background: var(--glass); transition: all .2s var(--ease); }
.cal-day.empty { background: transparent; }
.cal-day.today { border: 1.5px solid var(--accent); color: var(--ink); font-weight: 700; }
.cal-day.checked { background: var(--accent); color: #fff; font-weight: 700; }
.cal-day.checked.today { box-shadow: 0 0 10px var(--accent-glow); }

/* PO info card */
.po-card { background: linear-gradient(135deg, rgba(88,166,255,.06), rgba(188,140,255,.04));
  border: 1px solid rgba(88,166,255,.15); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
.po-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 8px; color: var(--blue); }
.po-card p { font-size: 13px; color: var(--ink2); line-height: 1.6; }
.po-card .highlight { color: var(--blue); font-weight: 600; }

/* ═══════════════ BOTTOM NAV ═══════════════ */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: rgba(13,17,23,.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--border); padding: 6px 0 calc(var(--safe-bottom) + 6px); }
.bottom-nav-inner { max-width: 520px; margin: 0 auto; display: flex; }
.bottom-nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 0; background: none; border: none; color: var(--faint); font-size: 10px; font-weight: 600;
  transition: all .2s var(--ease); }

function loadJSON(k, def) { try { var v = JSON.parse(localStorage.getItem(k)); return v || def; } catch(e) { return def; } }
function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }

// Tiến độ set giữ suốt tuần (T2 → CN), sang tuần mới (thứ 2) tự reset
function weekStartStr() {
  var d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function ensureToday() {
  var wk = weekStartStr(), saved = loadJSON("gt_prog_week", "");
  if (saved === wk) return;
  var oldDay = loadJSON("gt_prog_date", "");
  // Lần đầu dùng bản tuần: giữ tiến độ nếu nó được lưu trong tuần này
  if (!saved && oldDay && oldDay >= wk) { saveJSON("gt_prog_week", wk); return; }
  prog = {}; saveJSON("gt_prog", prog); saveJSON("gt_prog_week", wk);
}
function showToast(msg) {

}

  var all = d.list.every(function(it, i) { return (prog[progKey(d.id, i)] || 0) >= totalSets(it); });

}

function todayStr() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function progKey(d,i) { return d + ":" + i; }
function totalSets(it) { var m = /^(\d+)/.exec(it[1]); return m ? +m[1] : 3; }

/* ═══════════════════════════════════════════════
   STREAK CALCULATION
   ═══════════════════════════════════════════════ */
function dateKey(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function parseKey(k) { var p = k.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
// Ngày nghỉ (T3, T5) không bắt buộc điểm danh, không làm mất chuỗi.
function isSkipDate(d) { var day = DAYS[(d.getDay() + 6) % 7]; return !!day.rest; }

function calcStreak() {
  var today = new Date(); today.setHours(0,0,0,0);
  var current = 0, d = new Date(today), first = true;
  for (var guard = 0; guard < 4000; guard++) {
    var key = dateKey(d);
    if (checkins[key]) current++;
    else if (isSkipDate(d)) { /* ngày nghỉ: bỏ qua, giữ chuỗi */ }
    else if (first) { /* hôm nay chưa tập: chưa tính là mất chuỗi */ }
    else break;
    first = false;
    d.setDate(d.getDate() - 1);
  }
  // longest: khoảng trống giữa 2 lần tập chỉ được phép là ngày nghỉ
  var longest = 0, streak = 0, keys = Object.keys(checkins).sort();
  for (var i = 0; i < keys.length; i++) {
    if (i === 0) streak = 1;
    else {
      var prev = parseKey(keys[i-1]), curr = parseKey(keys[i]), ok = true;
      for (var g = new Date(prev.getFullYear(), prev.getMonth(), prev.getDate()+1); g < curr; g.setDate(g.getDate()+1)) {
        if (!isSkipDate(g)) { ok = false; break; }
      }
      streak = ok ? streak + 1 : 1;
    }
    if (streak > longest) longest = streak;
  }
  return { current: current, longest: longest, total: keys.length };
}

function thisWeekCount() {
  var today = new Date(); today.setHours(0,0,0,0);
  var dayOfWeek = today.getDay(); // 0=Sun
  var monday = new Date(today);
  monday.setDate(today.getDate() - ((dayOfWeek + 6) % 7));
  var count = 0;
  for (var i = 0; i < 7; i++) {
    var d = new Date(monday); d.setDate(monday.getDate() + i);
    var key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    if (checkins[key] && !isSkipDate(d)) count++;
  }
  return count;
}

function getDayDateThisWeek(dayId) {
  // dayId: 0=Mon(T2), 1=Tue(T3), ..., 6=Sun(CN)
  var today = new Date(); today.setHours(0,0,0,0);
  var dow = today.getDay(); // 0=Sun
  var monday = new Date(today);
  monday.setDate(today.getDate() - ((dow + 6) % 7));
  var target = new Date(monday);
  target.setDate(monday.getDate() + dayId);
  if (target > today) return null;
  return target.getFullYear() + '-' + String(target.getMonth()+1).padStart(2,'0') + '-' + String(target.getDate()).padStart(2,'0');
}

  html += '</ul></div>';

  // Nav
  html += '<div class="nav-btns"><button class="nav-btn" id="prevBtn"' + (i===0?' disabled':'') + '>← Bài trước</button>';
  html += '<button class="nav-btn" id="nextBtn"' + (!hasNext?' disabled':'') + '>Bài sau →</button></div>';
  html += '<div style="height:70px"></div>';
  html += '</div>';

  appEl.innerHTML = html;

  // Events
  var $ = function(x) { return document.getElementById(x); };
  function on(id, fn) { var el = $(id); if (el) el.addEventListener("click", fn); }

  on("backBtn", function() { state.view = "home"; render(); });
  on("homeBtn2", function() { state.view = "home"; render(); });
  on("incBtn", function() {
    ensureToday();
    prog[k] = Math.min(t, n+1);
    saveJSON("gt_prog", prog);
    autoCheckin();
    // Auto-start rest timer
    startTimer();
    renderExercise();
  });
  on("undoBtn", function() { prog[k] = Math.max(0, n-1); saveJSON("gt_prog", prog); renderExercise(); });
  on("resetBtn", function() { delete prog[k]; saveJSON("gt_prog", prog); renderExercise(); });
  on("nextBtn", function() { state.ex = i+1; renderExercise(); window.scrollTo(0,0); });
  on("nextBtn2", function() { state.ex = i+1; renderExercise(); window.scrollTo(0,0); });
  on("prevBtn", function() { state.ex = i-1; renderExercise(); window.scrollTo(0,0); });

  // Weight save
  var wInput = $("weightInput");
  if (wInput) {
    wInput.addEventListener("change", function() {
      var val = this.value.trim();
      if (val) { weights[wKey] = val; } else { delete weights[wKey]; }
      saveJSON("gt_weights", weights);
    });
  }

  // Timer presets
  appEl.querySelectorAll(".timer-preset").forEach(function(btn) {
    btn.addEventListener("click", function() {
      timerState.preset = +this.getAttribute("data-time");
      timerState.remaining = timerState.preset;
      stopTimer();
      renderTimerDisplay();
      appEl.querySelectorAll(".timer-preset").forEach(function(b) { b.classList.remove("active"); });
      this.classList.add("active");
    });
  });
  on("timerStart", function() {
    if (timerState.running) { stopTimer(); renderTimerDisplay(); }
    else startTimer();
  });
  on("timerReset", function() { stopTimer(); timerState.remaining = timerState.preset; renderTimerDisplay(); });

  // If timer was running, resume display
  if (timerState.running) renderTimerDisplay();
}

/* ─── TIMER ─── */
function formatTime(s) {
  var m = Math.floor(s / 60); var sec = s % 60;
  return (m > 0 ? m + ':' : '') + (m > 0 ? String(sec).padStart(2,'0') : sec + '');
}

function startTimer() {
  stopTimer();
  timerState.running = true;
  timerState.remaining = timerState.preset;
  renderTimerDisplay();
  timerInterval = setInterval(function() {
    timerState.remaining--;
    if (timerState.remaining <= 0) {
      timerState.remaining = 0;
      stopTimer();
      // Vibrate if available
      if (navigator.vibrate) navigator.vibrate([200,100,200]);
    }
    renderTimerDisplay();
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  timerState.running = false;
}

function renderTimerDisplay() {
  var display = document.getElementById("timerDisplay");
  var fill = document.getElementById("timerFill");
  var startBtn = document.getElementById("timerStart");
  var card = document.getElementById("timerCard");
  if (!display) return;

  var rem = timerState.running ? timerState.remaining : (timerState.remaining || timerState.preset);
  display.textContent = formatTime(rem);
  display.className = "timer-display" + (timerState.running ? " running" : "") + (rem === 0 && !timerState.running ? " done" : "");

  var pct = timerState.preset > 0 ? ((timerState.preset - rem) / timerState.preset * 100) : 0;
  if (fill) fill.style.width = pct + '%';
  if (card) card.classList.toggle("active", timerState.running);
  if (startBtn) {
    startBtn.textContent = timerState.running ? "Dừng" : (rem === 0 ? "Bắt đầu" : "Bắt đầu");
    startBtn.classList.toggle("start", !timerState.running);
  }
}

/* ─── STATS VIEW ─── */
function toggleCheckin() {
  var k = todayStr();
  if (!checkins[k]) checkins[k] = true;
  else if (confirm("Hủy điểm danh hôm nay?")) delete checkins[k];
  else return;
  saveJSON("gt_checkins", checkins);
  renderStats();
}

function renderStats() {
  var streak = calcStreak();
  document.documentElement.style.setProperty("--accent", "#ff6b6b");
  document.documentElement.style.setProperty("--accent-glow", "rgba(255,107,107,.12)");

  var html = '<div class="page-view">';
  html += '<h1 class="stats-title fade-in">📊 Thống kê</h1>';

  // Streak hero
  html += '<div class="streak-hero fade-in fade-in-d1">';
  html += '<div class="streak-fire">🔥</div>';
  html += '<div class="streak-number">' + streak.current + '</div>';
  html += '<div class="streak-text">ngày streak liên tiếp</div>';
  html += '</div>';

  // Check-in button
  var doneToday = !!checkins[todayStr()], skipToday = isSkipDate(new Date());
  html += '<button class="checkin-btn' + (doneToday ? ' checked' : '') + '" id="checkinBtn" style="margin:0 0 16px">' +
    (doneToday ? '✅ Đã điểm danh hôm nay! (bấm để hủy)' : (skipToday ? '😴 Hôm nay nghỉ — chuỗi vẫn được giữ (bấm nếu vẫn tập)' : '🔥 Điểm danh hôm nay')) + '</button>';

  // Streak details
  html += '<div class="streak-detail fade-in fade-in-d2">';
  html += '<div class="streak-stat"><div class="val">' + streak.longest + '</div><div class="lbl">Streak dài nhất</div></div>';
  html += '<div class="streak-stat"><div class="val">' + streak.total + '</div><div class="lbl">Tổng buổi tập</div></div>';
  html += '</div>';

  // Calendar
  html += renderCalendar();

  // Progressive overload info
  html += '<div class="po-card fade-in fade-in-d4">';
  html += '<h3>📈 Quy tắc Progressive Overload</h3>';
  html += '<p>Khi bạn đạt được <span class="highlight">rep tối đa</span> (VD: 12 rep) ở <span class="highlight">tất cả các set</span> trong 2 buổi liên tiếp → tăng <span class="highlight">2.5kg</span> (thân trên) hoặc <span class="highlight">5kg</span> (thân dưới).</p>';
  html += '<p style="margin-top:8px">Khi tăng tạ, rep sẽ rớt xuống 8-10 → tập lại lên 12 → chu kỳ lặp lại. Đây là cách cơ bắp phát triển.</p>';
  html += '</div>';

  // Reset data
  html += '<div style="text-align:center;margin-top:20px" class="fade-in fade-in-d4">';
  html += '<button class="ghost-btn" id="resetAllBtn" style="color:var(--accent);border-color:rgba(255,107,107,.2);padding:10px 24px">🗑️ Reset toàn bộ dữ liệu</button>';
  html += '</div>';

  html += '<div style="height:70px"></div></div>';
  appEl.innerHTML = html;

  var ciBtn = document.getElementById("checkinBtn");
  if (ciBtn) ciBtn.addEventListener("click", toggleCheckin);

  // Calendar nav events
  var calPrev = document.getElementById("calPrev");
  var calNext = document.getElementById("calNext");
  if (calPrev) calPrev.addEventListener("click", function() { calOffset--; updateCalendar(); });
  if (calNext) calNext.addEventListener("click", function() { calOffset++; updateCalendar(); });

  // Reset
  var resetBtn = document.getElementById("resetAllBtn");
  if (resetBtn) resetBtn.addEventListener("click", function() {
    if (confirm("Xóa toàn bộ dữ liệu tập luyện? Hành động này không thể hoàn tác.")) {
      prog = {}; weights = {}; checkins = {};
      saveJSON("gt_prog", prog); saveJSON("gt_weights", weights); saveJSON("gt_checkins", checkins);
      render();
    }
  });
}

var calOffset = 0;
function renderCalendar() {
  var today = new Date();
  var year = today.getFullYear();
  var month = today.getMonth() + calOffset;
  var d = new Date(year, month, 1);
  var displayMonth = d.toLocaleDateString('vi-VN', { month: 'long', year: 'numeric' });
  var daysInMonth = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  var firstDay = d.getDay(); // 0=Sun
  var startOffset = (firstDay + 6) % 7; // Mon=0

  var html = '<div class="calendar-card fade-in fade-in-d3">';
  html += '<div class="cal-nav"><button id="calPrev">← Trước</button><span>' + displayMonth + '</span><button id="calNext">Sau →</button></div>';
  html += '<div class="cal-grid">';
  ['T2','T3','T4','T5','T6','T7','CN'].forEach(function(h) { html += '<div class="cal-header">' + h + '</div>'; });

  // Empty cells before first day
  for (var e = 0; e < startOffset; e++) html += '<div class="cal-day empty"></div>';

  var todayStr2 = todayStr();
  for (var day = 1; day <= daysInMonth; day++) {
    var dateStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    var isToday = dateStr === todayStr2;
    var isChecked = !!checkins[dateStr];
    var cls = "cal-day" + (isToday ? " today" : "") + (isChecked ? " checked" : "") + (isSkipDate(new Date(d.getFullYear(), d.getMonth(), day)) ? " rest" : "");
    html += '<div class="' + cls + '">' + day + '</div>';
  }
  html += '</div></div>';
  return html;
}

function updateCalendar() {
  var card = document.querySelector(".calendar-card");
  if (!card) return;
  var temp = document.createElement("div");
  temp.innerHTML = renderCalendar();
  card.replaceWith(temp.firstChild);
  // Re-attach events
  var calPrev = document.getElementById("calPrev");
  var calNext = document.getElementById("calNext");
  if (calPrev) calPrev.addEventListener("click", function() { calOffset--; updateCalendar(); });
  if (calNext) calNext.addEventListener("click", function() { calOffset++; updateCalendar(); });
}

/* ═══════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════ */
// Auto-select today's day
ensureToday();
(function() {
  var dow = new Date().getDay(); // 0=Sun
  var map = [6,0,1,2,3,4,5]; // Sun=6, Mon=0, ...
  state.day = map[dow];
  // If rest day, go to previous training day
  if (DAYS[state.day].rest) {
    var prev = (state.day - 1 + 7) % 7;
    while (DAYS[prev].rest && prev !== state.day) prev = (prev - 1 + 7) % 7;
    state.day = prev;
  }
})();

render();
</script>
