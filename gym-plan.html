<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan tập gym 5 buổi/tuần</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #E8ECEF; --surface: #F7F8F9; --ink: #17222B; --muted: #55646F; --line: #C6CFD6;
  --day: #C8352B; --day-ink: #fff;
  --head: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #12181D; --surface: #1B232A; --ink: #E6EBEE; --muted: #9AA8B2; --line: #2F3B44; }
}
:root[data-theme="dark"] { --bg: #12181D; --surface: #1B232A; --ink: #E6EBEE; --muted: #9AA8B2; --line: #2F3B44; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--day); outline-offset: 2px; }
[hidden] { display: none !important; }

.wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 56px; }
h1 { font-family: var(--head); font-weight: 700; font-size: clamp(34px, 8vw, 52px); line-height: 1; margin: 8px 0 6px; }
.sub { margin: 0 0 20px; color: var(--muted); max-width: 60ch; }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 22px; }
.dbtn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 2px 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.dbtn .plate { width: 30px; height: 30px; border-radius: 50%; background: var(--c); display: grid; place-items: center; }
.dbtn .plate::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--surface); }
.dbtn .dn { font-family: var(--head); font-weight: 700; font-size: 18px; line-height: 1; }
.dbtn .dl { font-size: 12px; color: var(--muted); line-height: 1.1; text-align: center; }
.dbtn[aria-selected="true"] { border: 2px solid var(--c); box-shadow: 0 3px 0 var(--c); }
.dbtn.rest { opacity: .55; cursor: default; }
.dbtn.rest .plate { background: transparent; border: 2px dashed var(--line); }
.dbtn.rest .plate::after { display: none; }

.daytitle { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-left: 8px solid var(--day); padding-left: 12px; margin-bottom: 8px; }
.daytitle h2 { font-family: var(--head); font-size: 30px; margin: 0; line-height: 1.05; }
.daytitle span { color: var(--muted); }
.progress { color: var(--muted); font-size: 14px; margin: 0 0 12px; }

ol.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ex { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.ex .no { font-family: var(--head); font-weight: 700; font-size: 26px; color: var(--day); line-height: 1; }
.ex .nm { font-weight: 600; font-size: 17px; line-height: 1.2; }
.ex .mu { display: block; color: var(--muted); font-size: 14px; font-weight: 400; margin-top: 2px; }
.ex .rt { text-align: right; line-height: 1.15; }
.ex .sr { font-family: var(--head); font-weight: 700; font-size: 20px; white-space: nowrap; display: block; }
.ex .st { font-size: 13px; color: var(--muted); }
.ex.done { border-color: var(--day); }
.ex.done .st { color: var(--day); font-weight: 600; }
.ex.done .no { opacity: .5; }
@media (hover: hover) { .ex:hover { border-color: var(--day); } }
.static { display: block; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.note { margin-top: 20px; color: var(--muted); font-size: 14px; max-width: 70ch; }

/* exercise page */
.back { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px 8px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 600; }
.pos { margin-left: 10px; color: var(--muted); font-size: 14px; }
.page h1 { margin-top: 18px; }
.meta { color: var(--muted); margin: 0 0 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.chip { border: 1px solid var(--day); border-radius: 999px; padding: 2px 12px; font-weight: 600; font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
.card h2 { font-family: var(--head); font-size: 24px; margin: 0 0 10px; line-height: 1.1; }
.count { text-align: center; }
.count .big { font-family: var(--head); font-weight: 700; font-size: 64px; line-height: 1; }
.count .big small { font-size: 28px; color: var(--muted); font-weight: 600; }
.count .lbl { color: var(--muted); margin: 2px 0 14px; }
.dots { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.dot { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); display: grid; place-items: center; font-family: var(--head); font-weight: 700; font-size: 18px; color: var(--muted); }
.dot.on { background: var(--day); border-color: var(--day); color: var(--day-ink); }
.bigbtn { width: 100%; padding: 16px; border-radius: 12px; border: 0; background: var(--day); color: var(--day-ink); font-family: var(--head); font-weight: 700; font-size: 26px; letter-spacing: .01em; }
.bigbtn:active { transform: translateY(1px); }
.row2 { display: flex; gap: 10px; margin-top: 10px; }
.ghost { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-weight: 600; }
.ghost:disabled { opacity: .4; cursor: default; }
.finish { border: 2px solid var(--day); background: color-mix(in srgb, var(--day) 10%, transparent); }
.finish strong { font-family: var(--head); font-size: 28px; display: block; line-height: 1.1; margin-bottom: 8px; }
.finish .bigbtn { margin-top: 6px; }

.vbtn { display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; padding: 14px 16px; border-radius: 12px; font-weight: 600; background: var(--day); color: var(--day-ink); }
.vbtn svg { width: 20px; height: 20px; flex: none; }
.vhint { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
.player { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #000; }
.player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.vhint a { color: var(--muted); }
.vform { display: flex; gap: 8px; margin-top: 12px; }
.vform input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.vform button { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-weight: 600; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-size: 14px; margin-top: 8px; }

ol.steps { margin: 0; padding-left: 22px; }
ol.steps li { margin-bottom: 10px; padding-left: 4px; max-width: 62ch; }
ol.steps li::marker { color: var(--day); font-weight: 700; }
ul.tips { margin: 0; padding: 0; list-style: none; }
ul.tips li { margin-bottom: 8px; padding: 8px 12px; border-left: 4px solid var(--day); background: color-mix(in srgb, var(--day) 8%, transparent); border-radius: 0 8px 8px 0; max-width: 62ch; }
.pn { display: flex; gap: 10px; }
.pn button { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.pn button:disabled { opacity: .4; cursor: default; }
@media (max-width: 480px) { .dbtn .dl { font-size: 11px; } }
</style>
</head>
<body>
<div class="wrap">
  <section id="home">
    <h1>Plan tập gym 5 buổi mỗi tuần</h1>
    <p class="sub">Nghỉ thứ 3 và thứ 5, mỗi buổi 8 bài. Bấm vào một động tác để mở trang riêng với video, hướng dẫn và bộ đếm set.</p>
    <nav class="week" id="week" role="tablist" aria-label="Các ngày trong tuần"></nav>
    <div class="daytitle"><h2 id="dtitle"></h2><span id="dsub"></span></div>
    <p class="progress" id="progress"></p>
    <ol class="list" id="list"></ol>
    <p class="note">Mức tạ: chọn sao cho 1-2 rep cuối mỗi set khó nhưng vẫn đúng form. Khởi động 5-10 phút trước mỗi buổi. Nếu đau nhói (khác với mỏi cơ), dừng bài đó lại.</p>
  </section>
  <section id="page" class="page" hidden></section>
</div>

var DAYS = [
  { id: 0, short: "T2", label: "Push", title: "Thứ 2: Push", sub: "Ngực, Vai, Tay sau", c: "#C8352B", ink: "#fff",
    list: [["bench","4 x 8-10"],["incdb","3 x 10-12"],["cfly","3 x 12-15"],["shp","3 x 10"],["lat","3 x 12-15"],["rdf","3 x 15"],["tpd","3 x 12"],["ote","3 x 12"]] },
  { id: 1, short: "T3", label: "Nghỉ", rest: true },
  { id: 2, short: "T4", label: "Pull", title: "Thứ 4: Pull", sub: "Lưng, Tay trước", c: "#1E5BB8", ink: "#fff",
    list: [["dl","3 x 6-8"],["pu","3 x tối đa"],["lpd","3 x 10-12"],["scr","3 x 10-12"],["sar","3 x 10 mỗi bên"],["fp","3 x 15"],["bc","3 x 10-12"],["hc","3 x 12"]] },
  { id: 3, short: "T5", label: "Nghỉ", rest: true },

  { id: 6, short: "CN", label: "Recovery", title: "Chủ nhật: Recovery", sub: "Phục hồi", c: "#55646F", ink: "#fff", recovery: true }

var VIDEOS = {
  bench: "xUwpMhs85V8", incdb: "GyC765Vks5g", cfly: "iEjqAJLUMfc", shp: "0I10wx3fg3c",
  lat: "F7DlykphJc4", rdf: "XFSCz86Br7M", tpd: "7TSnAPgwn-8", ote: "KPvCT13h5x0",
  pu: "L6ndoM3jNKM", lpd: "ZXb5HGjK1f8", scr: "LCHju8ZAqJU", sar: "0nXhkDj8P48",
  fp: "94vy2V23vCk", bc: "qGk87JguYlo", hc: "w2GbcWoQr-Q",
  sq: "qJcesrdD0X4", rdl: "nE4-LcQ9px4", lp: "1HzPDRu3U4c", wl: "J0W3-L_Ke3s",
  le: "5Z1slEHoz0w", lc: "nHrBfH3R-nE", ht: "9NOrj13Xi_k", cr: "IddSR-71Dd4",
  ohp: "LYuBJZWs3dM", idc: "MGacw8jJie0", pl: "ZUZ0mXQFgvE", hlr: "Hi5q4M7EEyo", rt: "AxW2hfJ0XlA"
  /* Chưa có ID: dl (Deadlift), dbf (Dumbbell fly), sk (Skull crusher). Điền vào đây khi có, ví dụ: dl: "abc123XYZ_0" */
};

var state = { day: 0, ex: null };
function load(k) { try { return JSON.parse(localStorage.getItem(k) || "{}") || {}; } catch (e) { return {}; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
var prog = load("gymprog2");

var homeEl = document.getElementById("home");
var pageEl = document.getElementById("page");
var weekEl = document.getElementById("week");
var listEl = document.getElementById("list");
var dtitle = document.getElementById("dtitle");
var dsub = document.getElementById("dsub");
var progressEl = document.getElementById("progress");

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function key(d, i) { return d + ":" + i; }
function total(it) { var m = /^(\d+)/.exec(it[1]); return m ? +m[1] : 3; }
function reps(it) { return it[1].replace(/^\d+\s*x\s*/, ""); }
function setTheme(d) {
  document.documentElement.style.setProperty("--day", d.c);
  document.documentElement.style.setProperty("--day-ink", d.ink);
}

function renderWeek() {
  weekEl.innerHTML = "";
  DAYS.forEach(function (d) {
    var b = document.createElement("button");
    b.className = "dbtn" + (d.rest ? " rest" : "");
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(state.day === d.id));
    b.style.setProperty("--c", d.c || "var(--line)");
    if (d.rest) { b.disabled = true; b.setAttribute("aria-label", d.short + " nghỉ"); }
    b.innerHTML = '<span class="plate"></span><span class="dn">' + d.short + '</span><span class="dl">' + d.label + "</span>";
    if (!d.rest) b.addEventListener("click", function () { state.day = d.id; renderHome(); });
    weekEl.appendChild(b);
  });
}

function renderHome() {
  var d = DAYS[state.day];
  setTheme(d);
  renderWeek();
  dtitle.textContent = d.title;
  dsub.textContent = d.sub;
  listEl.innerHTML = "";
  if (d.recovery) {
    progressEl.textContent = "";
    listEl.innerHTML = '<li class="static"><div style="font-weight:600;font-size:17px">Cardio nhẹ: 25-30 phút</div><div style="color:var(--muted)">Đi bộ nhanh hoặc đạp xe ở cường độ vừa, vẫn nói chuyện được.</div></li>' +
      '<li class="static"><div style="font-weight:600;font-size:17px">Giãn cơ và foam rolling: 10-15 phút</div><div style="color:var(--muted)">Tập trung các nhóm cơ đã tập trong tuần: ngực, lưng, đùi, mông, vai.</div></li>';
    return;
  }
  var finished = 0;
  d.list.forEach(function (it, i) {
    var e = EX[it[0]], n = prog[key(d.id, i)] || 0, t = total(it), ok = n >= t;
    if (ok) finished++;
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.className = "ex" + (ok ? " done" : "");
    b.innerHTML = '<span class="no">' + (i + 1) + '</span><span class="nm">' + esc(e.n) + '<span class="mu">' + esc(e.m) + '</span></span>' +
      '<span class="rt"><span class="sr">' + esc(it[1]) + '</span><span class="st">' + (ok ? "Hoàn thành" : n + "/" + t + " set") + "</span></span>";
    b.addEventListener("click", function () { state.ex = i; showPage(); });
    li.appendChild(b);
    listEl.appendChild(li);
  });
  progressEl.textContent = "Đã hoàn thành " + finished + "/" + d.list.length + " bài";
}

var YT = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';

function showHome() {
  pageEl.hidden = true; homeEl.hidden = false;
  renderHome(); window.scrollTo(0, 0);
}
function showPage() {
  homeEl.hidden = true; pageEl.hidden = false;
  renderPage(); window.scrollTo(0, 0);
}

function videoHtml(id, e) {
  var v = VIDEOS[id];
  if (v) {
    return '<div class="player"><iframe src="https://www.youtube-nocookie.com/embed/' + v + '?rel=0&playsinline=1" title="Video hướng dẫn ' + esc(e.n) + '" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>' +
      '<p class="vhint"><a href="https://www.youtube.com/watch?v=' + v + '" target="_blank" rel="noopener noreferrer">Không xem được? Mở video trên YouTube</a></p>';
  }
  var url = "https://www.youtube.com/results?search_query=" + encodeURIComponent(e.n + " hướng dẫn kỹ thuật tiếng Việt");
  return '<a class="vbtn" href="' + url + '" target="_blank" rel="noopener noreferrer">' + YT + 'Tìm video hướng dẫn tiếng Việt</a>' +
    '<p class="vhint">Bài này chưa có video gắn sẵn. Thêm ID video vào đối tượng VIDEOS trong code để hiện trình phát ở đây.</p>';
}

function renderPage() {
  var d = DAYS[state.day], i = state.ex, it = d.list[i], id = it[0], e = EX[id];
  var k = key(d.id, i), n = prog[k] || 0, t = total(it), ok = n >= t;
  setTheme(d);
  var dots = "";
  for (var s = 1; s <= t; s++) dots += '<span class="dot' + (s <= n ? " on" : "") + '">' + s + "</span>";
  var hasNext = i < d.list.length - 1;

  pageEl.innerHTML =
    '<div><button class="back" id="back" type="button">&larr; ' + esc(d.title) + '</button><span class="pos">Bài ' + (i + 1) + "/" + d.list.length + "</span></div>" +
    "<h1>" + esc(e.n) + "</h1>" +
    '<p class="meta">' + esc(e.m) + "</p>" +
    '<div class="chips"><span class="chip">' + t + " set</span><span class=\"chip\">" + esc(reps(it)) + (/giây|tối đa/.test(it[1]) ? "" : " rep") + "</span></div>" +

    '<div class="card count" aria-live="polite">' +
      '<div class="big">' + n + "<small> / " + t + "</small></div>" +
      '<div class="lbl">set đã hoàn thành</div>' +
      '<div class="dots">' + dots + "</div>" +
      (ok
        ? '<div class="card finish" style="margin:0"><strong>Hoàn thành bài này</strong>' + (hasNext ? '<button class="bigbtn" id="next2" type="button">Bài tiếp theo &rarr;</button>' : '<button class="bigbtn" id="home2" type="button">Về danh sách</button>') + "</div>"
        : '<button class="bigbtn" id="inc" type="button">Xong set ' + (n + 1) + "</button>") +
      '<div class="row2"><button class="ghost" id="undo" type="button"' + (n === 0 ? " disabled" : "") + '>Hoàn tác</button><button class="ghost" id="reset" type="button"' + (n === 0 ? " disabled" : "") + ">Làm lại từ đầu</button></div>" +
    "</div>" +

    '<div class="card"><h2>Video hướng dẫn (tiếng Việt)</h2>' + videoHtml(id, e) + "</div>" +

    '<div class="card"><h2>Cách thực hiện</h2><ol class="steps">' + e.s.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ol></div>" +
    '<div class="card"><h2>Lưu ý</h2><ul class="tips">' + e.t.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div>" +
    '<div class="pn"><button id="prev" type="button"' + (i === 0 ? " disabled" : "") + '>&larr; Bài trước</button><button id="next" type="button"' + (hasNext ? "" : " disabled") + '>Bài sau &rarr;</button></div>';

  function $(x) { return document.getElementById(x); }
  function on(x, f) { var el = $(x); if (el) el.addEventListener("click", f); }
  on("back", showHome);
  on("home2", showHome);
  on("inc", function () { prog[k] = Math.min(t, n + 1); save("gymprog2", prog); renderPage(); });
  on("undo", function () { prog[k] = Math.max(0, n - 1); save("gymprog2", prog); renderPage(); });
  on("reset", function () { delete prog[k]; save("gymprog2", prog); renderPage(); });
  function go(delta) { state.ex = i + delta; showPage(); }
  on("next", function () { go(1); });
  on("next2", function () { go(1); });
  on("prev", function () { go(-1); });
}

renderHome();
</script>
